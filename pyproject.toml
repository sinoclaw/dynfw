[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dynfw"
version = "0.0.1"
description = "DynFW - Dynamic Fast-Weight Neural Networks (v0.0.1 baseline)"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "DynFW contributors"}]
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy"]

[tool.setuptools.packages.find]
include = ["dynfw*"]
